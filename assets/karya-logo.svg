    <!-- R -->
    <path fill-rule="evenodd" d="M 116 114 H 134.5 C 143.5 114 148.5 118.8 148.5 126.2 C 148.5 132.2 144.8 136.4 138.8 137.8 L 149.2 154 H 138.2 L 128.8 138.8 H 125.4 V 154 H 116 Z M 125.4 121.4 V 131.6 H 133.5 C 137.4 131.6 139.2 129.8 139.2 126.5 C 139.2 123.2 137.4 121.4 133.5 121.4 Z"/>
    <!-- Y -->
    <path d="M 154 114 H 164.8 L 173 128.2 L 181.2 114 H 192 L 177.6 137.5 V 154 H 168.4 V 137.5 Z"/>
    <!-- A -->
    <path fill-rule="evenodd" d="M 208.5 114 H 218.5 L 233.5 154 H 223.2 L 220.2 145.5 H 206.8 L 203.8 154 H 193.5 Z M 209.2 138.2 H 217.8 L 213.5 125.2 Z"/>
  </g>

  <!-- Signature Green Accent Line (Fading Right) -->
  <rect x="30" y="164" width="222" height="3.8" rx="1.9" fill="url(#karyaLineGrad)"/>

  <!-- Automations Italic Wordmark -->
  <text x="131" y="188" text-anchor="middle" fill="#F1F5F9" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19.5" font-weight="300" font-style="italic" letter-spacing="3.2">Automations</text>

  <!-- Signature Green Pointer Arrow + Circular Ring Emblem -->
  <g>
    <!-- Tilted Green Arrowhead -->
    <path d="M 230 101.5 L 269 98.5 C 270.3 98.4 271 99.4 270.7 100.7 L 261.2 136.5 C 260.8 137.8 259.3 138 258.4 136.9 L 229.3 103.5 C 228.5 102.5 228.9 101.6 230 101.5 Z" fill="#7ED957"/>
    <!-- Black Halo Cutout -->
